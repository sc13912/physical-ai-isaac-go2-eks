# Rendered with envsubst ($AWS_ACCOUNT_ID $AWS_DEFAULT_REGION $CLUSTER_NAME $VPC_ID $PRIVATE_AZ_1 $PRIVATE_SUBNET_1 $PRIVATE_AZ_2 $PRIVATE_SUBNET_2 $ADMIN_CIDR). Based on the Karpenter v1.15
# getting-started ClusterConfig; deltas: existing VPC private subnets, API endpoint limited to ADMIN_CIDR, EFS CSI add-on.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: ${CLUSTER_NAME}
  region: ${AWS_DEFAULT_REGION}
  version: "1.36"
  tags:
    karpenter.sh/discovery: ${CLUSTER_NAME}
    project: physical-ai-eks

kubeSchedulerConfig:
  nodeResourcesFit:
    scoringStrategy:
      type: MostAllocated

vpc:
  id: ${VPC_ID}
  subnets:
    private:
      ${PRIVATE_AZ_1}: { id: ${PRIVATE_SUBNET_1} }   # keyed by AZ (README step 3 looks it up)
      ${PRIVATE_AZ_2}: { id: ${PRIVATE_SUBNET_2} }
  clusterEndpoints:
    publicAccess: true
    privateAccess: true
  publicAccessCIDRs: ["${ADMIN_CIDR}"]

iam:
  withOIDC: true
  podIdentityAssociations:
  - namespace: kube-system
    serviceAccountName: karpenter
    roleName: ${CLUSTER_NAME}-karpenter
    permissionPolicyARNs:
    - arn:aws:iam::${AWS_ACCOUNT_ID}:policy/KarpenterControllerNodeLifecyclePolicy-${CLUSTER_NAME}
    - arn:aws:iam::${AWS_ACCOUNT_ID}:policy/KarpenterControllerIAMIntegrationPolicy-${CLUSTER_NAME}
    - arn:aws:iam::${AWS_ACCOUNT_ID}:policy/KarpenterControllerEKSIntegrationPolicy-${CLUSTER_NAME}
    - arn:aws:iam::${AWS_ACCOUNT_ID}:policy/KarpenterControllerInterruptionPolicy-${CLUSTER_NAME}
    - arn:aws:iam::${AWS_ACCOUNT_ID}:policy/KarpenterControllerResourceDiscoveryPolicy-${CLUSTER_NAME}
    - arn:aws:iam::${AWS_ACCOUNT_ID}:policy/KarpenterControllerZonalShiftPolicy-${CLUSTER_NAME}

iamIdentityMappings:
- arn: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/KarpenterNodeRole-${CLUSTER_NAME}"
  username: system:node:{{EC2PrivateDNSName}}
  groups:
  - system:bootstrappers
  - system:nodes

managedNodeGroups:
- name: system
  instanceType: m7i.xlarge
  amiFamily: AmazonLinux2023
  desiredCapacity: 2
  minSize: 2
  maxSize: 3
  privateNetworking: true
  volumeSize: 100
  tags:
    project: physical-ai-eks

zonalShiftConfig:
  enabled: true

addons:
- name: eks-pod-identity-agent
- name: vpc-cni
- name: coredns
- name: kube-proxy
- name: aws-efs-csi-driver
  useDefaultPodIdentityAssociations: true
