# AMP managed scraper config (min interval 30s). DCGM GPU metrics + Isaac Lab training scalars (promhook).
global:
  scrape_interval: 30s
  external_labels:
    cluster: ${CLUSTER_NAME}   # filled in by envsubst (README step 12)
scrape_configs:
  - job_name: dcgm
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_number]
        regex: dcgm-exporter;9400
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
  - job_name: isaac-train
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_name]
        regex: isaac;isaac-train;metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_robot]
        target_label: robot
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
  - job_name: kubernetes-apiservers
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: endpoints
    relabel_configs:
      - action: keep
        regex: default;kubernetes;https
        source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
