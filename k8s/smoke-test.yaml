# Rendered with envsubst '$IMAGE'. Not queued by Kueue (no queue label): proves driver + Newton + GPU throughput.
apiVersion: v1
kind: Pod
metadata:
  name: smoke-gpu
  namespace: isaac
spec:
  restartPolicy: Never
  nodeSelector:
    workload: isaac
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: smoke
      image: ${IMAGE}
      command: ["bash", "-c"]
      args:
        - |
          set -e
          nvidia-smi
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda, torch.cuda.get_device_name(0))"
          isaaclab train --rl_library rsl_rl --task Isaac-Velocity-Flat-UnitreeGo2 \
            --num_envs 4096 --max_iterations 30 --run_name smoke presets=newton_mjwarp 2>&1 \
            | grep -E "Physics |Learning iteration|Steps per second|Mean reward|Training time"
      resources:
        limits:
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
